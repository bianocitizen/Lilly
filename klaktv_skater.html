<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klak TV — Skater Profile</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#111;display:flex;align-items:flex-start;justify-content:center;min-height:100vh;padding:24px 0}
.phone{width:390px;height:844px;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;position:relative;border-radius:44px;box-shadow:0 0 0 10px #1e1e1e,0 0 0 11px #2a2a2a,0 30px 80px rgba(0,0,0,.85);overflow:hidden}
.pg{height:100%;overflow-y:auto;scrollbar-width:none}.pg::-webkit-scrollbar{display:none}

/* TOPBAR */
.topbar{position:absolute;top:0;left:0;right:0;z-index:30;padding:14px 18px 0;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.topbar>*{pointer-events:all}
.bk{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.6);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;cursor:pointer}
.top-right{display:flex;align-items:center;gap:7px}
.meta-pill{height:28px;border-radius:999px;background:rgba(0,0,0,.6);backdrop-filter:blur(14px);padding:0 10px;display:flex;align-items:center;gap:5px;font-size:10px;color:rgba(255,255,255,.65);white-space:nowrap}
.ib{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.6);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;cursor:pointer}

/* FEATURED HERO CAROUSEL
   Phone = 390px | padding-left = 20px | card = 318px | gap = 12px | peek = 40px
   scroll-padding-left ensures 2nd card also snaps 20px from left edge */
.feat-wrap{
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  padding:56px 0 0 0;
  gap:14px;
  scrollbar-width:none;
}
.feat-wrap::-webkit-scrollbar{display:none}
.feat-wrap::before,.feat-wrap::after{content:'';flex-shrink:0;width:32px}
.feat-card{
  flex-shrink:0;
  width:326px;
  height:400px;
  border-radius:20px;
  scroll-snap-align:center;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  transition:transform .3s ease;
}
.feat-card.dim::after{
  content:'';
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.38);
  pointer-events:none;
  border-radius:inherit;
}
.feat-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feat-grad{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.08) 0%,rgba(0,0,0,.04) 25%,rgba(0,0,0,.6) 65%,rgba(0,0,0,.9) 100%)}
.feat-info{position:absolute;bottom:0;left:0;right:0;padding:16px 18px 18px}
.feat-name{font-size:26px;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:.01em;line-height:1.05;margin-bottom:8px}
.feat-tags{display:flex;align-items:center;gap:7px}
.feat-dot{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.feat-tag{font-size:12px;color:rgba(255,255,255,.75);font-weight:500}

/* DOTS */
.dots{display:flex;justify-content:center;gap:5px;padding:10px 0 0}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .2s}
.dot.on{background:#fff;width:18px;border-radius:3px}

/* DETAIL STRIP */
.ds{padding:14px 20px 0}
.ds-title{font-size:16px;font-weight:700;color:#fff;line-height:1.2}
.ds-sub{font-size:12px;color:rgba(255,255,255,.4);margin-top:3px}
.ds-desc{font-size:12.5px;color:rgba(255,255,255,.55);margin-top:9px;line-height:1.55}
.ds-more{display:inline;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.35);cursor:pointer}

/* BADGES */
.br{display:flex;align-items:center;gap:5px;padding:10px 20px 0;flex-wrap:wrap}
.bch{border:1px solid rgba(255,255,255,.22);border-radius:4px;padding:2px 6px;font-size:9px;font-weight:700;color:rgba(255,255,255,.55);letter-spacing:.05em}

/* CTA */
.cta{display:flex;gap:9px;padding:14px 20px 0;align-items:center}
.btn-w{flex:1;height:42px;border-radius:999px;background:#fff;border:none;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;font-weight:700;color:#000;cursor:pointer}
.btn-f{height:42px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.12);border:none;display:flex;align-items:center;gap:5px;font-size:13.5px;font-weight:600;color:#fff;cursor:pointer}

/* SECTION HEADER */
.sh{font-size:17px;font-weight:700;color:#fff;padding:32px 20px 12px;display:flex;align-items:center;justify-content:space-between}
.sh-r{color:rgba(255,255,255,.32);font-size:14px;font-weight:400}

/* FILTER PILL */
.fpill{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:2px}
.fp{padding:0 11px;height:24px;border-radius:999px;font-size:11px;font-weight:600;color:rgba(255,255,255,.45);display:flex;align-items:center;cursor:pointer;transition:all .15s}
.fp.on{background:#fff;color:#000}

/* VIDEO LIST */
.vl{padding:0 20px}
.vr{display:flex;align-items:flex-start;gap:13px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}
.vr:last-child{border-bottom:none}
.vth{width:112px;height:64px;border-radius:10px;flex-shrink:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.vth-pl{width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.vb{flex:1;min-width:0;padding-top:1px}
.vs{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.vt{font-size:14px;font-weight:700;color:#fff;line-height:1.2;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vd{font-size:12px;color:rgba(255,255,255,.42);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vm{width:26px;flex-shrink:0;display:flex;align-items:flex-start;justify-content:center;color:rgba(255,255,255,.3);font-size:16px;padding-top:3px;cursor:pointer}

/* PARTS CAROUSEL */
.car{display:flex;overflow-x:auto;gap:12px;padding:0 20px;scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.pc{flex-shrink:0;width:176px;cursor:pointer}
.pc-th{width:176px;height:98px;border-radius:12px;overflow:hidden;position:relative;margin-bottom:8px;display:flex;align-items:center;justify-content:center}
.pc-dur{position:absolute;bottom:6px;right:8px;font-size:10px;color:#fff;background:rgba(0,0,0,.65);padding:2px 5px;border-radius:4px;font-weight:600}
.pc-dot{position:absolute;bottom:6px;left:8px;font-size:10px;color:rgba(255,255,255,.7);background:rgba(0,0,0,.5);padding:2px 6px;border-radius:4px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.pc-title{font-size:13px;font-weight:700;color:#fff;line-height:1.2}
.pc-meta{font-size:11px;color:rgba(255,255,255,.38);margin-top:2px}

/* ABOUT */
.ac-wrap{display:flex;overflow-x:auto;gap:12px;padding:0 20px;scrollbar-width:none}.ac-wrap::-webkit-scrollbar{display:none}
.ac{flex-shrink:0;width:272px;background:rgba(255,255,255,.07);border-radius:14px;padding:15px 16px}
.ac-lbl{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.32);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.ac-ttl{font-size:15px;font-weight:700;color:#fff;margin-bottom:9px;line-height:1.25}
.ac-txt{font-size:12.5px;color:rgba(255,255,255,.58);line-height:1.6}

/* COMPANIES */
.co-list{padding:0 20px}
.co{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}
.co:last-child{border-bottom:none}
.co-ic{width:38px;height:38px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;letter-spacing:-.02em;background:rgba(255,255,255,.08);color:rgba(255,255,255,.6)}
.co-b{flex:1}
.co-nm{font-size:14px;font-weight:600;color:#fff;margin-bottom:2px}
.co-mt{font-size:12px;color:rgba(255,255,255,.38)}
.co-ar{color:rgba(255,255,255,.18);font-size:15px}

/* LINKS */
.lk-list{padding:0 20px}
.lk{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}
.lk:last-child{border-bottom:none}
.lk-ic{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.07);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.lk-b{flex:1;min-width:0}
.lk-src{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.32);text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}
.lk-nm{font-size:13.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-yr{font-size:11px;color:rgba(255,255,255,.3);margin-top:1px}
.lk-ar{color:rgba(255,255,255,.18);font-size:15px}
.spacer{height:44px}

/* MODAL */
.ovl{position:absolute;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:flex-end}
.ovl.open{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{width:100%;height:82%;background:#1c1c1e;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.drag-bar{width:36px;height:4px;background:rgba(255,255,255,.18);border-radius:2px;margin:10px auto 0}
.mhdr{display:flex;align-items:center;justify-content:space-between;padding:13px 20px 0}
.m-src{font-size:10px;font-weight:700;color:rgba(255,255,255,.38);text-transform:uppercase;letter-spacing:.08em}
.m-cls{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:#fff;font-weight:300}
.mbody{flex:1;overflow-y:auto;padding:14px 20px 28px;scrollbar-width:none}.mbody::-webkit-scrollbar{display:none}
.m-title{font-size:20px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:5px}
.m-sub{font-size:12px;color:rgba(255,255,255,.38);margin-bottom:18px}
.m-txt{font-size:13.5px;color:rgba(255,255,255,.62);line-height:1.65;margin-bottom:16px}
.m-quote{border-left:3px solid rgba(255,255,255,.22);padding:11px 14px;background:rgba(255,255,255,.05);border-radius:0 10px 10px 0;font-size:13.5px;font-style:italic;color:rgba(255,255,255,.7);line-height:1.6;margin-bottom:16px}
.m-sh{font-size:13px;font-weight:700;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.07em;margin:18px 0 10px}
.m-car{display:flex;overflow-x:auto;gap:10px;padding-bottom:4px;scrollbar-width:none}.m-car::-webkit-scrollbar{display:none}
.m-qcard{flex-shrink:0;width:230px;background:rgba(255,255,255,.06);border-radius:12px;padding:14px}
.m-qcard-txt{font-size:13px;font-style:italic;color:rgba(255,255,255,.65);line-height:1.55;margin-bottom:8px}
.m-qcard-src{font-size:10px;font-weight:700;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.06em}

/* FADE TRANSITION */
.content-area{transition:opacity .22s}
.content-area.fade{opacity:0}
</style>
</head>

</div>

": "Pretty Sweet", "desc": "A cinematic feature by Spike Jonze. MJ’s part blends architectural elegance with technical mastery across LA."}, {"bg": "linear-gradient(135deg,#1a0a00,#2e1500)", "src": "Lakai · 2007", "title": "Fully Flared", "desc": "Directed by Ty Evans & Spike Jonze. Considered one of the greatest parts in skateboarding history."}, {"bg": "linear-gradient(135deg,#080a1c,#0d102e)", "src": "Girl Skateboards · 2003", "title": "Yeah Right!", "desc": "Landmark Spike Jonze production. MJ’s section demonstrates a refined approach to LA street terrain."}, {"bg": "linear-gradient(135deg,#1a0800,#2a1200)", "src": "Chocolate Skateboards · 1999", "title": "Chocolate Tour", "desc": "Cross-country tour document that helped establish MJ as a marquee name in skateboarding."}, {"bg": "linear-gradient(135deg,#001a08,#002e12)", "src": "Girl Skateboards · 1996", "title": "Mouse", "desc": "MJ’s breakout appearance in the underground classic directed by Spike Jonze."}], "parts": [{"bg": "linear-gradient(135deg,#1a0a00,#2e1500)", "title": "Fully Flared", "meta": "Lakai · 2007", "dur": "6:42", "type": "Solo Part"}, {"bg": "linear-gradient(135deg,#16071e,#260d30)", "title": "Pretty Sweet", "meta": "Girl/Chocolate · 2012", "dur": "5:18", "type": "Solo Part"}, {"bg": "linear-gradient(135deg,#071a1a,#0d2d2a)", "title": "Koston & Johnson", "meta": "Lakai · 2015", "dur": "4:55", "type": "Split Part"}, {"bg": "linear-gradient(135deg,#080a1c,#0d102e)", "title": "Yeah Right!", "meta": "Girl Skateboards · 2003", "dur": "4:12", "type": "Solo Part"}], "about": [{"lbl": "Marc Johnson", "ttl": "Street skating redefined by precision", "txt": "Born in 1975 in Reno, Nevada, MJ turned professional in the mid-90s and spent three decades redefining what street skating could look and feel like — quiet power, exact technique, no wasted motion."}, {"lbl": "Early Career", "ttl": "From Reno to Girl Skateboards", "txt": "MJ’s early footage circulated on VHS tapes before Girl Skateboards signed him. His part in Mouse (1996) introduced a generation to a skater who seemed incapable of an awkward move."}, {"lbl": "Legacy", "ttl": "Co-founder · Lakai & Fourstar", "txt": "Beyond skating, MJ co-founded Lakai Footwear in 1999 with Guy Mariano and others, creating one of the most influential skate shoe companies of the 2000s."}], "companies": [{"ic": "CH", "bg": "linear-gradient(135deg,#1a0800,#2e1200)", "ic_color": "rgba(255,150,50,.9)", "nm": "Chocolate Skateboards", "mt": "Pro Skater · 1996 – Present"}, {"ic": "LK", "bg": "linear-gradient(135deg,#071818,#0d2826)", "ic_color": "rgba(60,200,180,.9)", "nm": "Lakai Footwear", "mt": "Co-Founder · 1999 – Present"}, {"ic": "4S", "bg": "linear-gradient(135deg,#141407,#242408)", "ic_color": "rgba(210,200,60,.9)", "nm": "Fourstar Clothing", "mt": "Co-Founder · 2003 – Present"}, {"ic": "VT", "bg": "linear-gradient(135deg,#080818,#0e0e2e)", "ic_color": "rgba(120,120,255,.9)", "nm": "Venture Trucks", "mt": "Team Rider · 2000s"}, {"ic": "SF", "bg": "linear-gradient(135deg,#1a0606,#2e0808)", "ic_color": "rgba(255,80,60,.9)", "nm": "Spitfire Wheels", "mt": "Team Rider · 2001 – Present"}], "links": [{"src": "Thrasher Magazine", "title": "The Marc Johnson Interview", "yr": "2008 · Interview", "modal": "link1"}, {"src": "Skateboarder Magazine", "title": "Fully Flared: Behind the Scenes", "yr": "2007 · Feature", "modal": "link2"}, {"src": "Jenkem Magazine", "title": "The Story of Lakai Footwear", "yr": "2019 · Long-Read", "modal": "link3"}, {"src": "TransWorld Skateboarding", "title": "MJ’s Greatest Lines — A Retrospective", "yr": "2012 · Video Essay", "modal": "link4"}], "modals": {"bio": {"src": "Marc Johnson", "body": "<div class=\"m-title\">Marc Johnson — MJ</div><div class=\"m-sub\">Reno, Nevada · Born 1975</div><div class=\"m-txt\">Marc Johnson is widely regarded as one of the most technically gifted and stylistically precise street skaters of his generation. His ability to combine technical difficulty with an almost imperceptible ease of execution set him apart from the moment his earliest footage began circulating on VHS tapes.</div><div class=\"m-quote\">“I don’t think about tricks. I think about movement — how I’m reading the environment and responding to it. The trick is just what happens at the end of that conversation.”</div><div class=\"m-txt\">After turning professional in the mid-90s with Girl Skateboards, MJ went on to co-found Lakai Footwear (1999) and Fourstar Clothing (2003).</div><div class=\"m-sh\">Key Moments</div><div class=\"m-car\"><div class=\"m-qcard\"><div class=\"m-qcard-txt\">“Mouse changed everything. Nobody had filmed skating quite like that.”</div><div class=\"m-qcard-src\">Spike Jonze on Mouse (1996)</div></div><div class=\"m-qcard\"><div class=\"m-qcard-txt\">“The Fully Flared opener is as close to perfect as a video part gets.”</div><div class=\"m-qcard-src\">Thrasher Mag, 2007</div></div></div>"}, "link1": {"src": "Thrasher Magazine · 2008", "body": "<div class=\"m-title\">The Marc Johnson Interview</div><div class=\"m-sub\">By Michael Burnett · Thrasher Magazine, 2008</div><div class=\"m-txt\">By the time Fully Flared dropped in 2007, Marc Johnson had already spent more than a decade quietly rewriting what it meant to be a professional street skater.</div><div class=\"m-quote\">“The whole point for me has always been to find something true in the movement. If it looks effortless it’s because I spent two years figuring out why it felt wrong.”</div><div class=\"m-sh\">Related Quotes</div><div class=\"m-car\"><div class=\"m-qcard\"><div class=\"m-qcard-txt\">“Every spot has a right answer. I’m just trying to find it before I run out of attempts.”</div><div class=\"m-qcard-src\">MJ, on approach</div></div><div class=\"m-qcard\"><div class=\"m-qcard-txt\">“Style isn’t something you add on top. It’s what’s left when you remove everything unnecessary.”</div><div class=\"m-qcard-src\">MJ, Thrasher 2008</div></div></div>"}, "link2": {"src": "Skateboarder Magazine · 2007", "body": "<div class=\"m-title\">Fully Flared: Behind the Scenes</div><div class=\"m-sub\">Skateboarder Magazine, 2007</div><div class=\"m-txt\">It took three years, two directors (Ty Evans and Spike Jonze), and enough high-definition footage to fill a small archive. The result — Lakai’s Fully Flared — immediately entered the conversation as one of the most significant skateboarding films ever made.</div><div class=\"m-quote\">“There were weeks where I didn’t land anything worth keeping. That’s part of it.”</div><div class=\"m-sh\">Director Notes</div><div class=\"m-car\"><div class=\"m-qcard\"><div class=\"m-qcard-txt\">“MJ is the most consistent person I’ve ever filmed. He’d land something perfect and just walk away.”</div><div class=\"m-qcard-src\">Ty Evans, Director</div></div></div>"}, "link3": {"src": "Jenkem Magazine · 2019", "body": "<div class=\"m-title\">The Story of Lakai Footwear</div><div class=\"m-sub\">Jenkem, 2019</div><div class=\"m-txt\">In 1999, a small group of professional skateboarders decided they were tired of riding for shoe companies that didn’t understand skateboarding. They built Lakai.</div><div class=\"m-quote\">“We made it for people who skate. Everything else follows from that.”</div><div class=\"m-sh\">Timeline</div><div class=\"m-car\"><div class=\"m-qcard\"><div class=\"m-qcard-txt\">1999 — Lakai founded by MJ, Guy Mariano, Rick Howard, Mike Carroll and others.</div><div class=\"m-qcard-src\">Founding</div></div><div class=\"m-qcard\"><div class=\"m-qcard-txt\">2007 — Fully Flared elevates the brand to global recognition.</div><div class=\"m-qcard-src\">Peak Moment</div></div></div>"}, "link4": {"src": "TransWorld Skateboarding · 2012", "body": "<div class=\"m-title\">MJ’s Greatest Lines</div><div class=\"m-sub\">TransWorld, 2012</div><div class=\"m-txt\">By the release of Pretty Sweet in 2012, Marc Johnson had accumulated enough landmark footage to fill a career twice over.</div><div class=\"m-quote\">“A line is a sentence. If one word is wrong the whole thing loses meaning.”</div>"}}}, "prod": {"photo": "data:image/webp;base64,UklGRqxLAQBXRUJQVlA4WAoAAAAgAAAANwQANwQASUNDUMgBAAAAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADZWUDggvkkBAHDbBp0BKjgEOAQ+MRaKRCIhCGSehBABglnbi0mX+P94WWZbJ/8S+keHmgEdnpOx/qH+m5g3Pv7p/zv8D5N/yXhCeof7L/nbEeWFtXfRB/Pf+p1B/+LzIfun/YwuIEaofUCT3kP0Lfr8wO5vPurY/Gb2a/x7znerV5VOlEaWP6M2ojfHf/n5+fl/+j4H/nH3r/G/Lv8vPmc0v8d/o1/QPz/+8/zH7mf5P91/uJ3t/rX+P/4vUv9uf6T8wv8P+6X34rreiP8J/ff9//jP89/8P9V7sX5P/0/3Ps1+p/6v/u/df9hn84/sP+w/u/74f4D52/83nKfiP+56r3+V/7v+e9m//w/2n+2/dL4gfVv/n/0vwN/zv+6/7//Kf5//1/57/////yxfu17XA1svpjzz5kxd/R9cLGmyNVK5fNHK54vAdz5uk6ZNhC61a+2mHZR7/+u0dKWtW3h70yUPXqXWZ3sNpLLfK66sxEwxn5m7TAm4UCR+LIx9msThwFKCoKCPqLabNXqUwikVaxfBp5YDWGXW5PSwvD2MhA3d+/8pW6IPyfzko1pv9J/XcQzUECnRnfBE0XPROzcgNa7WD0UH+p1mLyRdPBmWxn+j/t7oYb59jlDlphUxwTYuOFjCcsP7CyJzytNszlmC37IainBrhpMmV5tuxX658fIt7izL9wfJYx7ni8inP59OgRxv1Y4t+kvcWpOaAfo6vAgzQPYZUxkGtRlaysLSXsu4VdPTT0snKi8djkMUHjrBrCUk6QoSGrAdVIZSKl/V1nXIM8aWt4o+dHYu4PPcPofvhEdK8Eppw5IXPkaRXpNB0nh1DPFOn/zF9j5Of+gNSc6yalBNowAmPAqBhYMKu44iKS0/r/516BWn53WR0l2OnM+qwTbTEDoGDEuYv+Bmkbay3c0+M2uV3sXo17PQJDsVMM1XqgRZl7iaaxkIR+XM5/n10aZxNnUSQfHxkH5Go0V06x+nxm19VmudWglIspOwEWYBQu6KHqKwS3Fzg30QPCqwKUA5ZJJqFZBUBCujoFl3mIkXgH2RyDS0xzzywYB8EqdwwfDte+NQ+HbDICKKJdllCJZ9D+mVivmYig7oO8lDdyn7XpWBRUdsUmcMPGAjiYuu6b96uIutTIJkKrEZb01J32mInnzU+lYwbFCpdVpgpqnkeSnK3nA4JDeyV7yYo/pnXcR0A0Qjc9ar0Rqj+cBPGlMF5VVFNw4w4SD reakout debut with City Stars in 2002, P-Rod joined Plan B Skateboards in 2004 and spent a decade delivering some of the most technically demanding video parts in the sport’s history."}, {"lbl": "Primitive", "ttl": "Co-founder of a new generation brand", "txt": "In 2014, P-Rod co-founded Primitive Skateboarding, channeling his years of professional experience into building a rider-owned company rooted in technical skating and artistic identity."}], "companies": [{"ic": "PR", "bg": "linear-gradient(135deg,#0a0020,#1a0040)", "ic_color": "rgba(160,100,255,.9)", "nm": "Primitive Skateboarding", "mt": "Co-Founder · 2014 – Present"}, {"ic": "NK", "bg": "linear-gradient(135deg,#060608,#0e0e14)", "ic_color": "rgba(220,220,220,.9)", "nm": "Nike SB", "mt": "Signature Athlete · 2004 – Present"}, {"ic": "PB", "bg": "linear-gradient(135deg,#001a12,#002e20)", "ic_color": "rgba(60,200,120,.9)", "nm": "Plan B Skateboards", "mt": "Pro Skater · 2004 – 2014"}, {"ic": "CS", "bg": "linear-gradient(135deg,#1a0800,#2e1400)", "ic_color": "rgba(255,140,60,.9)", "nm": "City Stars Skateboards", "mt": "Pro Skater · 2002 – 2004"}, {"ic": "IN", "bg": "linear-gradient(135deg,#080818,#0e0e28)", "ic_color": "rgba(100,130,255,.9)", "nm": "Independent Trucks", "mt": "Team Rider · 2005 – Present"}], "links": [{"src": "Thrasher Magazine", "title": "P-Rod: The Reason Interview", "yr": "2007 · Interview", "modal": "prod_link1"}, {"src": "Jenkem Magazine", "title": "Building Primitive from Scratch", "yr": "2015 · Feature", "modal": "prod_link2"}, {"src": "Nike SB Chronicles", "title": "P-Rod Chronicles — Full Episode", "yr": "2010 · Video", "modal": "prod_link3"}, {"src": "TransWorld Skateboarding", "title": "P-Rod’s Most Technical Tricks", "yr": "2013 · Video Essay", "modal": "prod_link4"}], "modals": {"bio": {"src": "Paul Rodriguez", "body": "<div class=\"m-title\">Paul Rodriguez — P-Rod</div><div class=\"m-sub\">Tarzana, California · Born 1984</div><div class=\"m-txt\">Paul Rodriguez Jr. grew up in the San Fernando Valley as the son of comedian Paul Rodriguez, and discovered skateboarding through videos. His natural technical ability and relentless work ethic led to a debut part at 16 that immediately caught the attention of the entire industry.</div><div class=\"m-quote\">“I watch my footage over and over. Not because I love seeing myself skate — because I’m looking for what I did wrong and what I can push further.”</div><div class=\"m-sh\">Career Highlights</div><div class=\"m-car\"><div class=\"m-qcard\"><div class=\"m-qcard-txt\">8× X Games medalist — more than almost any street skater in the event’s history.</div><div class=\"m-qcard-src\">X Games Record</div></div><div class=\"m-qcard\"><div class=\"m-qcard-txt\">“P-Rod has the cleanest style in the game. Every trick lands exactly where it should.”</div><div class=\"m-qcard-src\">Rodney Mullen</div></div></div>"}, "prod_link1": {"src": "Thrasher Magazine · 2007", "body": "<div class=\"m-title\">P-Rod: The Reason Interview</div><div class=\"m-sub\">Thrasher Magazine, 2007</div><div class=\"m-txt\">The Reason came out and immediately people started talking about P-Rod differently. Not as a contest skater who also makes videos, but as a video part skater who also happens to win contests.</div><div class=\"m-quote\">“The contest stuff is about execution under pressure. The video stuff is about finding something nobody’s seen done that way before.”</div>"}, "prod_link2": {"src": "Jenkem Magazine · 2015", "body": "<div class=\"m-title\">Building Primitive from Scratch</div><div class=\"m-sub\">Jenkem, 2015</div><div class=\"m-txt\">When P-Rod announced Primitive in 2014, the skateboarding world wasn’t entirely surprised. He’d spent a decade at Plan B developing a perspective on what a skateboard company should stand for. Primitive was the result of that decade of thinking.</div><div class=\"m-quote\">“I didn’t just want another board company. I wanted something that reflected where street skating is actually going.”</div>"}, "prod_link3": {"src": "Nike SB Chronicles · 2010", "body": "<div class=\"m-title\">P-Rod Chronicles</div><div class=\"m-sub\">Nike SB, 2010</div><div class=\"m-txt\">The Nike SB Chronicles series gave P-Rod something rare in modern skateboarding: uninterrupted time to build a complete picture of a skater across multiple cities, with no contest schedule and no deadlines.</div><div class=\"m-quote\">“Nike SB let me be myself on camera. It wasn’t about products. It was about showing people why I still get excited about a curb in the right light.”</div>"}, "prod_link4": {"src": "TransWorld Skateboarding · 2013", "body": "<div class=\"m-title\">P-Rod’s Most Technical Tricks</div><div class=\"m-sub\">TransWorld, 2013</div><div class=\"m-txt\">Over a decade of professional skating, Paul Rodriguez Jr. has assembled a catalogue of technical tricks that would be career-defining for most skaters. This video essay breaks down ten of the most difficult.</div><div class=\"m-quote\">“People think technical skating is about the trick. It’s about the speed, the pop timing, the landing, and making it look like you could do it again. That’s the hard part.”</div>"}}}};

// Set photos (done separately so src is valid before rendering)
document.getElementById('photo-mj').src   = SKATERS.mj.photo;
document.getElementById('photo-prod').src = SKATERS.prod.photo;

let activeSkater = 'mj';
let filterMode   = 'new';
let currentModals = {};

/* ---- RENDER ---- */
function renderContent(id) {
  activeSkater = id;
  var sk = SKATERS[id];
  currentModals = sk.modals;

  document.getElementById('top-meta').textContent = sk.meta;
  document.getElementById('ds-title').textContent = sk.title;
  document.getElementById('ds-sub').textContent   = sk.sub;
  document.getElementById('ds-desc').innerHTML    = sk.desc + '<span class="ds-more" onclick="openModal(\'bio\')"> MORE</span>';

  document.getElementById('br').innerHTML = sk.badges.map(function(b){
    return '<div class="bch">'+b+'</div>';
  }).join('');

  renderVideos(sk.videos);

  document.getElementById('parts-car').innerHTML = sk.parts.map(function(p){
    return '<div class="pc">' +
      '<div class="pc-th" style="background:#111">' +
        '<div style="width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center"><svg width=10 height=10 viewBox="0 0 24 24" fill="#fff"><polygon points="5,3 19,12 5,21"/></svg></div>' +
        '<div class="pc-dot">'+p.type+'</div>' +
        '<div class="pc-dur">&#9654; '+p.dur+'</div>' +
      '</div>' +
      '<div class="pc-title">'+p.title+'</div>' +
      '<div class="pc-meta">'+p.meta+'</div>' +
    '</div>';
  }).join('');

  document.getElementById('about-wrap').innerHTML = sk.about.map(function(a){
    return '<div class="ac"><div class="ac-lbl">'+a.lbl+'</div><div class="ac-ttl">'+a.ttl+'</div><div class="ac-txt">'+a.txt+'</div></div>';
  }).join('');

  document.getElementById('co-list').innerHTML = sk.companies.map(function(c){
    return '<div class="co">' +
      '<div class="co-ic"><span>'+c.ic+'</span></div>' +
      '<div class="co-b"><div class="co-nm">'+c.nm+'</div><div class="co-mt">'+c.mt+'</div></div>' +
      '<div class="co-ar">&#x203A;</div>' +
    '</div>';
  }).join('');

  document.getElementById('lk-list').innerHTML = sk.links.map(function(l){
    return '<div class="lk" onclick="openModal(\''+l.modal+'\')">' +
      '<div class="lk-ic"><svg width=16 height=16 viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.5)" stroke-width=2 stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>' +
      '<div class="lk-b"><div class="lk-src">'+l.src+'</div><div class="lk-nm">'+l.title+'</div><div class="lk-yr">'+l.yr+'</div></div>' +
      '<div class="lk-ar">&#x203A;</div>' +
    '</div>';
  }).join('');
}

function renderVideos(list) {
  var arr = filterMode === 'new' ? list.slice() : list.slice().reverse();
  document.getElementById('vl').innerHTML = arr.map(function(v){
    return '<div class="vr">' +
      '<div class="vth" style="background:'+v.bg+'"><div class="vth-pl"><svg width=9 height=9 viewBox="0 0 24 24" fill="#fff"><polygon points="5,3 19,12 5,21"/></svg></div></div>' +
      '<div class="vb"><div class="vs">'+v.src+'</div><div class="vt">'+v.title+'</div><div class="vd">'+v.desc+'</div></div>' +
      '<div class="vm">⋯</div>' +
    '</div>';
  }).join('');
}

/* ---- FILTER ---- */
function setFilter(v) {
  filterMode = v;
  document.getElementById('fp-new').classList.toggle('on', v==='new');
  document.getElementById('fp-chr').classList.toggle('on', v==='chr');
  renderVideos(SKATERS[activeSkater].videos);
}

/* ---- CAROUSEL SCROLL ---- */
(function(){
  var wrap = document.getElementById('featWrap');
  var keys = ['mj','prod'];
  var t;
  // init dim on all non-first cards
  wrap.querySelectorAll('.feat-card').forEach(function(c,i){ if(i!==0) c.classList.add('dim'); });

  wrap.addEventListener('scroll', function(){
    clearTimeout(t);
    t = setTimeout(function(){
      var idx = Math.round(wrap.scrollLeft / (326 + 14));
      idx = Math.max(0, Math.min(idx, keys.length-1));
      document.getElementById('dot-0').classList.toggle('on', idx===0);
      document.getElementById('dot-1').classList.toggle('on', idx===1);
        wrap.querySelectorAll('.feat-card').forEach(function(c,i){ c.classList.toggle('dim', i!==idx); });
      var newId = keys[idx];
      if(newId !== activeSkater){
        var area = document.getElementById('contentArea');
        area.classList.add('fade');
        setTimeout(function(){
          renderContent(newId);
          area.classList.remove('fade');
        }, 200);
      }
    }, 80);
  });
})();

/* ---- MODAL ---- */
function openModal(key){
  var m = currentModals[key];
  if(!m) return;
  document.getElementById('m-src').textContent = m.src;
  document.getElementById('mbody').innerHTML = m.body;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
}

/* ---- INIT ---- */
renderContent('mj');
</script>
</body>
